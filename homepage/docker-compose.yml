services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - "3000:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost,dashboard.home.lab,home.lab:3000,192.168.1.82:3000"
    volumes:
      - ./config:/app/config
    restart: unless-stopped
