services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "America/Chicago"
      FTLCONF_webserver_api_password: "strongPassword2001?"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_misc_dnsmasq_lines: "address=/home.lab/192.168.1.82"
    volumes:
      - "./etc-pihole:/etc/pihole"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
